name: 云端自动构建打包

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows 安装包与绿色版
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        run: rustup toolchain install stable --profile minimal

      - name: 编译并打包
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory $env:RUNNER_TEMP
          ./scripts/package.ps1 -NsisCompiler $compiler

      - name: 上传构建产物 (Exe 与 Zip)
        uses: actions/upload-artifact@v4
        with:
          name: Daozai-Windows-Custom-Build
          path: dist/*
          if-no-files-found: error
